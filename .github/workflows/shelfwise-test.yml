name: Shelfwise Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.data/shelfwise/**'
      - '.github/workflows/shelfwise-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.data/shelfwise/**'
      - '.github/workflows/shelfwise-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: .data/shelfwise/generator

      - name: Build Rust generator
        working-directory: .data/shelfwise/generator
        run: cargo build --release

      - name: Run generator with test config
        working-directory: .data/shelfwise/generator
        run: |
          cargo run --release -- --config config.test.toml
          echo "Generator completed"

      - name: Verify CSV files were generated
        working-directory: .data/shelfwise/postgres
        run: |
          echo "Checking for generated CSV files..."
          ls -lh *.csv

      - name: Set up environment
        run: |
          cp .data/.env.template .data/shelfwise/.env

      - name: Start PostgreSQL
        run: |
          cd .data/shelfwise
          docker compose up -d postgres

      - name: Wait for database initialization
        run: |
          cd .data/shelfwise
          echo "Waiting for database to initialize..."
          echo "This includes loading all CSV files, creating foreign keys, and building indexes..."
          for i in {1..120}; do
            # Check if the init script has completed by verifying:
            # 1. The transactions table exists and has data (count > 0)
            # 2. The read-only user exists (created at the very end of init.sql)
            TRANSACTION_COUNT=$(docker compose exec -T postgres psql -U postgres -d shelfwise -t -c "SELECT COUNT(*) FROM transactions;" 2>/dev/null | tr -d ' ')
            READONLY_USER=$(docker compose exec -T postgres psql -U postgres -d shelfwise -t -c "SELECT 1 FROM pg_roles WHERE rolname='shelfwise_readonly';" 2>/dev/null | tr -d ' ')

            if [ "$TRANSACTION_COUNT" -gt 0 ] 2>/dev/null && [ "$READONLY_USER" = "1" ]; then
              echo "✓ Database fully initialized with $TRANSACTION_COUNT transactions loaded"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "✗ Database initialization timed out after 240 seconds"
              echo "Transaction count: ${TRANSACTION_COUNT:-0}"
              echo "Readonly user exists: ${READONLY_USER:-not found}"
              exit 1
            fi
            echo "Waiting for init.sql to complete... ($i/120) [transactions: ${TRANSACTION_COUNT:-0}]"
            sleep 2
          done

      - name: Check database logs
        if: always()
        run: |
          cd .data/shelfwise
          echo "=== PostgreSQL initialization logs ==="
          docker compose logs postgres | tail -100

      - name: Run test queries
        run: |
          cd .data/shelfwise
          echo "=== Running test queries ==="
          
          # Function to run query and validate result
          run_query_with_validation() {
            local query_name="$1"
            local query="$2"
            local min_expected="$3"

            echo ""
            echo "$query_name"
            result=$(docker compose exec -T postgres psql -U postgres -d shelfwise -t -c "$query" | tr -d ' ')
            echo "Result: $result"

            if [ -z "$result" ] || [ "$result" -lt "$min_expected" ] 2>/dev/null; then
              echo "✗ FAILED: Expected at least $min_expected rows, got: ${result:-0}"
              exit 1
            else
              echo "✓ PASSED: Found $result rows (expected >= $min_expected)"
            fi
          }

          # Validate core tables have data
          run_query_with_validation "1. Count products:" "SELECT COUNT(*) FROM products;" 1
          run_query_with_validation "2. Count stores:" "SELECT COUNT(*) FROM stores;" 1
          run_query_with_validation "3. Count transactions:" "SELECT COUNT(*) FROM transactions;" 1

          echo ""
          echo "4. Sales summary by date (first 5 days):"
          sales_result=$(docker compose exec -T postgres psql -U postgres -d shelfwise -t -c "SELECT COUNT(*) FROM sales_daily;" | tr -d ' ')
          if [ "$sales_result" -lt 1 ] 2>/dev/null; then
            echo "✗ FAILED: No sales data found"
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d shelfwise -c "
            SELECT
              date,
              COUNT(DISTINCT store_id) as stores,
              COUNT(DISTINCT sku) as products,
              SUM(units_sold) as total_units,
              ROUND(SUM(revenue)::numeric, 2) as total_revenue
            FROM sales_daily
            GROUP BY date
            ORDER BY date
            LIMIT 5;
          "
          echo "✓ Sales data validated"

          echo ""
          echo "5. Top 5 products by revenue:"
          top_products=$(docker compose exec -T postgres psql -U postgres -d shelfwise -t -c "
            SELECT COUNT(*) FROM (
              SELECT p.sku
              FROM sales_daily s
              JOIN products p ON s.sku = p.sku
              GROUP BY p.sku
              LIMIT 5
            ) subq;
          " | tr -d ' ')
          if [ "$top_products" -lt 1 ] 2>/dev/null; then
            echo "✗ FAILED: No product revenue data found"
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d shelfwise -c "
            SELECT
              p.sku,
              p.brand,
              p.category,
              ROUND(SUM(s.revenue)::numeric, 2) as total_revenue,
              SUM(s.units_sold) as total_units
            FROM sales_daily s
            JOIN products p ON s.sku = p.sku
            GROUP BY p.sku, p.brand, p.category
            ORDER BY total_revenue DESC
            LIMIT 5;
          "
          echo "✓ Product revenue data validated"

          echo ""
          echo "6. Inventory levels by store type:"
          inventory_result=$(docker compose exec -T postgres psql -U postgres -d shelfwise -t -c "SELECT COUNT(*) FROM inventory_daily;" | tr -d ' ')
          if [ "$inventory_result" -lt 1 ] 2>/dev/null; then
            echo "✗ FAILED: No inventory data found"
            exit 1
          fi
          docker compose exec -T postgres psql -U postgres -d shelfwise -c "
            SELECT
              s.store_type,
              COUNT(DISTINCT i.store_id) as stores,
              ROUND(AVG(i.on_hand)::numeric, 2) as avg_on_hand,
              SUM(i.on_hand) as total_on_hand
            FROM inventory_daily i
            JOIN stores s ON i.store_id = s.store_id
            WHERE i.date = (SELECT MAX(date) FROM inventory_daily)
            GROUP BY s.store_type
            ORDER BY total_on_hand DESC;
          "
          echo "✓ Inventory data validated"

          echo ""
          echo "=== All test queries completed successfully ==="

      - name: Cleanup
        if: always()
        run: |
          cd .data/shelfwise
          docker compose down -v
