---
# Axiom Demo Setup Playbook
#
# Syncs demo files and starts containers
#
# Behavior:
# - Starts containers if they're not already running
# - Skips container restart if already running (use docker_reset to force)
# - Auto-detects if full file sync is needed (first deploy)
#
# Variables:
# - docker_reset: Wipe containers/volumes and restart fresh (default: false)
# - sync_mode: File transfer mode - 'auto', 'full', or 'incremental' (default: auto)
#              'auto' = full sync if no files exist, otherwise incremental
#              'full' = always include large CSV files
#              'incremental' = exclude large CSV files
#
# Usage:
# - Normal run: ansible-playbook -i inventory.json playbooks/axiom.yml
# - Reset Docker: ansible-playbook -i inventory.json playbooks/axiom.yml -e "docker_reset=true"
# - Force full sync: ansible-playbook -i inventory.json playbooks/axiom.yml -e "sync_mode=full"

- name: Deploy Axiom demo
  hosts: demo_servers
  become: true
  vars:
    docker_reset: false      # Wipe containers/volumes and restart fresh
    sync_mode: auto          # auto/full/incremental - controls large CSV file transfer
    rsync_excludes:          # Common excludes for rsync
      - "--exclude=.*"
      - "--exclude=venv"
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=target"
      - "--exclude=node_modules"
  tasks:
    - name: Check if destination directory has files (for auto sync detection)
      ansible.builtin.find:
        paths: "/home/ubuntu/axiom-data/{{ demo_profile }}"
        file_type: file
        recurse: true
      register: dest_files
      ignore_errors: true

    - name: Determine sync mode
      ansible.builtin.set_fact:
        full_sync: >-
          {{ (sync_mode == 'auto' and (dest_files.matched | default(0) == 0)) or (sync_mode == 'full') }}

    - name: Ensure axiom-data directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0755"
        state: directory
      loop:
        - /home/ubuntu/axiom-data
        - /home/ubuntu/axiom-data/{{ demo_profile }}

    - name: Display sync mode
      ansible.builtin.debug:
        msg: >-
          Sync: {{ 'FULL (includes CSV files)' if full_sync | bool else 'INCREMENTAL (excludes CSV files)' }}
          (sync_mode={{ sync_mode }}, dest_files={{ dest_files.matched | default(0) }})

    - name: Upload demo profile - FULL (includes large CSV files)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../../.data/{{ demo_profile }}/"
        dest: "/home/ubuntu/axiom-data/{{ demo_profile }}/"
        recursive: true
        delete: true
        delay_updates: false
        rsync_opts: "{{ rsync_excludes + ['--compress', '--size-only', '--partial', '--inplace', '--timeout=7200'] }}"
      delegate_to: localhost
      become: false
      when: full_sync | bool

    - name: Upload demo profile - INCREMENTAL (excludes large CSV files)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../../.data/{{ demo_profile }}/"
        dest: "/home/ubuntu/axiom-data/{{ demo_profile }}/"
        recursive: true
        delete: false
        delay_updates: false
        rsync_opts: "{{ rsync_excludes + ['--exclude=*.csv', '--compress', '--inplace', '--timeout=300'] }}"
      delegate_to: localhost
      become: false
      when: not (full_sync | bool)

    - name: Load environment variables from .env
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../.env"
        name: env_vars

    - name: Setup environment variables from Ansible -> Docker
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/env_vars.j2"
        dest: "/home/ubuntu/axiom-data/{{ demo_profile }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Check if compose services are running
      ansible.builtin.shell: |
        set -o pipefail
        docker compose ps --status running -q | head -1
      args:
        chdir: "/home/ubuntu/axiom-data/{{ demo_profile }}"
        executable: /bin/bash
      register: compose_check
      changed_when: false
      failed_when: false

    - name: Set container status
      ansible.builtin.set_fact:
        containers_running: "{{ compose_check.stdout | default('') | length > 0 }}"

    - name: Stop all Docker containers if docker_reset is enabled
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/axiom-data/{{ demo_profile }}
        files:
          - compose.yaml
        state: absent
        remove_volumes: true
      when: docker_reset | bool
      tags: ['docker_reset']

    - name: Start containers (if not running or after docker_reset)
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/axiom-data/{{ demo_profile }}
        files:
          - compose.yaml
        build: always
        pull: always
        state: present
        remove_orphans: true
      when: >-
        docker_reset | bool or
        not containers_running | bool
      tags: ['start']
      ignore_errors: >-
        {{ not docker_reset | bool }}
      register: start_result

    - name: Display status
      ansible.builtin.debug:
        msg: >-
          {% if docker_reset | bool %}Containers reset and restarted.
          {% elif start_result is defined and start_result.changed %}Containers started.
          {% elif containers_running | bool %}Containers already running (use docker_reset=true to force).
          {% else %}Setup complete.{% endif %}
