---
- name: Cron Tasks
  tags:
    - cron
  hosts: cron_servers
  become: true
  tasks:
    - name: Ensure /home/ubuntu/axiom-scripts exists
      ansible.builtin.file:
        path: /home/ubuntu/axiom-scripts
        owner: ubuntu
        group: ubuntu
        mode: "0755"
        state: directory
        recurse: true

    - name: Deploy monitoring script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../scripts/connector-keepalive.sh"
        dest: "/home/ubuntu/axiom-scripts/connector-keepalive.sh"
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Configure health check cron job (runs every minute)
      ansible.builtin.cron:
        name: "Axiom connector-keepalive"
        job: >
          cron_query='{{ cron_query }}'
          cron_url='{{ cron_url }}'
          SLACK_WEBHOOK='{{ slack_webhook }}'
          /home/ubuntu/axiom-scripts/connector-keepalive.sh 2>&1 | logger -t gql-check
        user: "ubuntu"

- name: ShelfWise Nightly Import Cron
  tags:
    - cron
    - shelfwise
  hosts: shelfwise-blue
  become: true
  tasks:
    - name: Ensure logs directory exists
      ansible.builtin.file:
        path: /home/ubuntu/logs
        owner: ubuntu
        group: ubuntu
        mode: "0755"
        state: directory

    - name: Configure ShelfWise nightly import cron job (6 AM UTC daily)
      ansible.builtin.cron:
        name: "ShelfWise nightly import"
        job: "/home/ubuntu/axiom-data/shelfwise/scripts/nightly-import.sh >> /home/ubuntu/logs/cron.log 2>&1"
        hour: "6"
        minute: "0"
        user: "ubuntu"
