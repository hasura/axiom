# ShelfWise - Heavy Load/Import Configuration
# Optimized for c6g.4xlarge (16 vCPU, 32 GB RAM)
# Use this for initial data generation and PostgreSQL import
#
# Usage: docker compose -f compose.load.yaml up -d

services:
  postgres:
    image: postgres
    container_name: shelfwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shelfwise
      READONLY_PASSWORD: ${READONLY_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 28G
    command:
      - "postgres"
      # === MEMORY (32GB total, ~24GB for PG) ===
      - "-c"
      - "shared_buffers=8GB"
      - "-c"
      - "effective_cache_size=20GB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "work_mem=256MB"
      # === WAL / CHECKPOINTS (aggressive for import) ===
      - "-c"
      - "wal_buffers=256MB"
      - "-c"
      - "max_wal_size=16GB"
      - "-c"
      - "min_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "checkpoint_timeout=30min"
      # === PARALLELISM (16 vCPUs) ===
      - "-c"
      - "max_parallel_workers=12"
      - "-c"
      - "max_parallel_workers_per_gather=6"
      - "-c"
      - "max_parallel_maintenance_workers=8"
      - "-c"
      - "max_worker_processes=16"
      # === I/O (SSD optimized) ===
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "random_page_cost=1.1"
      # === CONNECTIONS ===
      - "-c"
      - "max_connections=30"
      # === AUTOVACUUM (reduced during import) ===
      - "-c"
      - "autovacuum_max_workers=4"
      - "-c"
      - "autovacuum_naptime=60s"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.2"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.1"
      # === LOGGING ===
      - "-c"
      - "log_min_duration_statement=5000"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "default_statistics_target=100"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local

