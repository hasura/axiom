# ShelfWise Data Generator - TEST Configuration
# Smaller dataset for quick testing and development

[date_range]
# Just 3 months of data for testing
start_date = "2024-09-01"
end_date = "2024-11-30"

[scale]
# Minimal product and store counts for fast generation
max_products = 250
num_domestic_stores = 10
num_international_stores = 1

[customers]
# Smaller customer pool for testing
num_customers = 6100

[performance]
# Print progress every N days during generation
progress_interval_days = 5
# Flush buffers to disk every N days (larger = faster but uses more RAM)
flush_interval_days = 10
# Batch size for write operations (larger = faster but uses more RAM)
# Recommended: 2000-3000 for 16GB+ RAM, 5000 for 32GB+ RAM
batch_size = 1000