# ShelfWise Data Generator - TEST Configuration
# Realistic scale for basket size verification

[date_range]
# Just 3 days of data for testing
start_date = "2025-01-01"
end_date = "2025-01-03"
cap_to_tomorrow = false

[scale]
# Realistic product count, fewer stores
max_products = 250
num_domestic_stores = 5
num_international_stores = 0

[customers]
num_customers = 1000

[performance]
flush_interval_days = 1
batch_size = 2000