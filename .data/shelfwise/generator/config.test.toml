# ShelfWise Data Generator - TEST Configuration
# Smaller dataset for quick testing and development

[date_range]
# Just 3 months of data for testing
start_date = "2024-09-01"  # Format: YYYY-MM-DD
end_date = "2024-11-30"    # Format: YYYY-MM-DD

[scale]
# Minimal product and store counts for fast generation
max_products = 50          # Just 50 products (vs 400 in production)
num_domestic_stores = 10   # Just 10 domestic stores (vs 100 in production)
num_international_stores = 1  # Just 1 international store (vs 5 in production)

[assortment]
# Same coverage ratios as production
online_coverage = 1.0      # 100% - online has everything
big_box_coverage = 0.9     # 90% of products
suburban_coverage = 0.7    # 70% of products
urban_coverage = 0.7       # 70% of products
convenience_coverage = 0.7 # 70% of products

[performance]
# More frequent progress updates for shorter runs
progress_interval_days = 10  # Print every 10 days (vs 50 in production)