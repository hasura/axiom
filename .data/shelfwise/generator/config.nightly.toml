# ShelfWise Nightly Data Generator Configuration
# This config is automatically updated by nightly-import.sh before each run
# to match the actual database state (product count, store count, customer count)

[date_range]
# These dates define the FULL historical range for customer/driver generation
# start_date should match the original full load to ensure consistent created_date/hire_date distribution
# end_date is overridden by CLI args (--start-date, --end-date) from nightly-import.sh
start_date = "2019-02-01"  # Original full load start date (DO NOT CHANGE)
end_date = "2025-12-15"    # Placeholder - overridden by CLI args

# Prevent generating future data
cap_to_tomorrow = true

[scale]
# ⚠️ CRITICAL: These values are AUTO-UPDATED from the database before each nightly run
# The nightly-import.sh script queries the database and updates these values via sed
# This ensures transaction generation matches the actual number of stores in the system
# DO NOT manually edit - they reflect the current database state
max_products = 250  # Auto-updated from: SELECT COUNT(*) FROM products
num_domestic_stores = 10  # Auto-updated from: SELECT COUNT(*) FROM stores WHERE store_type != 'online'
num_international_stores = 0  # Not currently used in nightly mode

[customers]
# Base customer count - automatically updated from database before each run
# The generator will add ~0.1% new customers per day organically
num_customers = 6100  # Auto-updated from: SELECT COUNT(*) FROM customers
# Daily growth rate (0.1% = 6-10 new customers per day for a 6100 customer base)
daily_growth_rate = 0.001

[performance]
# Optimized for single-day generation
flush_interval_days = 1         # Flush to disk every day
batch_size = 4000               # Batch size for write operations