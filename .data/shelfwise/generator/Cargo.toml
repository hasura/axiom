[package]
name = "shelfwise-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
