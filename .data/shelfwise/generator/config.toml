# ShelfWise Data Generator Configuration
# Adjust these settings to control data volume and realism

[date_range]
# Full historical data: February 1, 2019 to November 30, 2025
# This captures ~7 years including pre-COVID, COVID, and recovery periods
start_date = "2019-02-01"  # Format: YYYY-MM-DD
end_date = "2025-11-30"    # Format: YYYY-MM-DD

[scale]
# Number of products to generate
# Hardcoded in generator: 400 products (line 238)
# Realistic retail: 500-2000 products per category
max_products = 400

# Number of stores
# Hardcoded in generator: 100 domestic (line 363), 5 international (line 441)
# Total: 106 stores (1 online + 100 domestic + 5 international)
num_domestic_stores = 100
num_international_stores = 5

[assortment]
# Percentage of products available at each store type
# This dramatically affects data volume
# Values aligned with generator source of truth (generator.rs line 862-867)
online_coverage = 1.0      # 100% - online has everything
big_box_coverage = 0.9     # 90% of products (was hardcoded as 0.9)
suburban_coverage = 0.7    # 70% of products (was hardcoded as 0.7)
urban_coverage = 0.7       # 70% of products (was hardcoded as 0.7)
convenience_coverage = 0.7 # 70% of products (was hardcoded as 0.7)

[performance]
# Print progress every N days during data generation
progress_interval_days = 50