# ShelfWise Data Generator Configuration
# Simple configuration for controlling data volume

[date_range]
# Date range for data generation
start_date = "2019-02-01"  # Format: YYYY-MM-DD
end_date = "2025-11-30"    # Format: YYYY-MM-DD

[scale]
# Number of products and stores
max_products = 7991
num_domestic_stores = 100
num_international_stores = 5

[customers]
# Customer pool size
num_customers = 578022

[performance]
# Print progress every N days during generation
progress_interval_days = 90
# Flush buffers to disk every N days (larger = faster but uses more RAM)
flush_interval_days = 90
# Batch size for write operations (larger = faster but uses more RAM)
# Recommended: 2000-3000 for 16GB+ RAM, 5000 for 32GB+ RAM
batch_size = 4000